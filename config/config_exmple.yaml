# Copy this template to config/config.yaml and customize it before startup.
# See start_steps.md for Docker container addresses and setup instructions.


# The container entrypoint uses this address to set ETCD_ADDR.
etcd-addr: 172.16.232.8:2379

# Publish the shared settings below to etcd at /config/config.yaml.
server:
  jwt-secret: MTAxNTkwMTg1Mw==
  version: "1.0"
  name: tiktok

snowflake:
  worker-id: 0
  datancenter-id: 0

mysql:
  addr: 127.0.0.1:3306
  database: tiktok
  username: tiktok
  password: tiktok
  charset: utf8mb4

# Configure Alibaba Cloud OSS credentials and a bucket for video operations.
oss:
  endpoint:
  accessKey-id:
  accessKey-secret:
  bucketname:
  main-directory: tiktok

etcd:
  addr: 127.0.0.1:2379

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: chat-messages
  group-id: chat-service
  dead-letter-topic: chat-messages-dlq

redis:
  addr: 127.0.0.1:6379
  password: tiktok

# Use addresses that each service can bind to and other containers can reach.
services:
  api:
    name: api
    load-balance: false
    addr:
      - 127.0.0.1:10001
  user:
    name: user
    load-balance: false
    addr:
      - 127.0.0.1:10002
  chat:
    name: chat
    load-balance: false
    addr:
      - 127.0.0.1:10003
  follow:
    name: follow
    load-balance: false
    addr:
      - 127.0.0.1:10004
  interaction:
    name: interaction
    load-balance: false
    addr:
      - 127.0.0.1:10005
  video:
    name: video
    load-balance: false
    addr:
      - 127.0.0.1:10006
